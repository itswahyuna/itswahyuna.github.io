    <script>
        if ("serviceWorker" in navigator) {
            let cts = false;
            window.notifyOfflineCacheUsed = function () {
                if (cts) return;
                if (typeof window.toastt !== "function") {
                    window.__pendingOfflineCacheToast = true;
                    return;
                }

                cts = true;
                window.toastt("using offline mode");
            };

            navigator.serviceWorker.register("./sw.js")
                .catch(error => {
                    console.error(error);
                });

            navigator.serviceWorker.addEventListener("message", event => {
                if (
                    event.data?.type === "CACHE_USED" &&
                    !cts
                ) {
                    window.notifyOfflineCacheUsed();
                }
            });
        }
    </script>

    <script>
        let policyRequestId = 0;
        let policyCloseTimer = null;
        let policyCloseHandler = null;

        function clearPolicyCloseCleanup(modal) {
            clearTimeout(policyCloseTimer);
            policyCloseTimer = null;

            if (policyCloseHandler && modal) {
                modal.removeEventListener('transitionend', policyCloseHandler);
                policyCloseHandler = null;
            }
        }

        function renderPolicyContent(container, policy) {
            if (!policy || typeof policy.title !== 'string' || !Array.isArray(policy.blocks)) {
                throw new Error('error');
            }

            const content = document.createDocumentFragment();

            policy.blocks.forEach(block => {
                if (block.type === 'heading' && typeof block.text === 'string') {
                    const heading = document.createElement('h4');
                    heading.textContent = block.text;
                    heading.style.margin = '16px 0 6px';
                    heading.style.fontWeight = '600';
                    content.appendChild(heading);
                    return;
                }

                if (block.type === 'paragraph' && typeof block.text === 'string') {
                    const paragraph = document.createElement('p');
                    paragraph.textContent = block.text;
                    content.appendChild(paragraph);
                    return;
                }

                if (block.type === 'list' && Array.isArray(block.items) &&
                    block.items.every(item => typeof item === 'string')) {
                    const list = document.createElement('ul');
                    list.style.paddingLeft = '18px';
                    list.style.marginBottom = '12px';

                    block.items.forEach(item => {
                        const listItem = document.createElement('li');
                        listItem.textContent = item;
                        list.appendChild(listItem);
                    });

                    content.appendChild(list);
                    return;
                }

                throw new Error('error');
            });

            container.replaceChildren(content);
        }

        function showPolicyLoading(container) {
            const loading = document.createElement('div');
            loading.className = 'policy-skeleton';
            loading.setAttribute('role', 'status');
            loading.setAttribute('aria-label', 'Loading policy document');
            loading.setAttribute('aria-busy', 'true');

            const preview = document.createElement('div');
            preview.className = 'policy-skeleton-preview';
            preview.setAttribute('aria-hidden', 'true');

            const skeletonLines = [
                'title',
                'line line-long',
                'line line-medium',
                'line line-short'
            ];
            for (let section = 0; section < 4; section++) {
                skeletonLines.push(
                    'heading',
                    'line line-long',
                    'line line-medium',
                    'line line-long',
                    'line line-short'
                );
            }

            skeletonLines.forEach(className => {
                const line = document.createElement('span');
                line.className = `policy-skeleton-bar ${className}`;
                preview.appendChild(line);
            });

            loading.appendChild(preview);
            container.replaceChildren(loading);
        }

        function showVersionLoading(container) {
            const loading = document.createElement('div');
            loading.className = 'policy-skeleton version-skeleton';
            loading.setAttribute('role', 'status');
            loading.setAttribute('aria-label', 'Loading version information');
            loading.setAttribute('aria-busy', 'true');

            const label = document.createElement('span');
            label.className = 'policy-skeleton-bar version-skeleton-label';
            label.setAttribute('aria-hidden', 'true');

            const value = document.createElement('span');
            value.className = 'policy-skeleton-bar version-skeleton-value';
            value.setAttribute('aria-hidden', 'true');

            const description = document.createElement('span');
            description.className = 'policy-skeleton-bar version-skeleton-description';
            description.setAttribute('aria-hidden', 'true');

            loading.append(label, value, description);
            container.replaceChildren(loading);
        }

        function renderVersionContent(container, version) {
            const content = document.createElement('div');
            content.className = 'version-info';

            const label = document.createElement('span');
            label.className = 'version-info-label';
            label.textContent = 'Current version';

            const value = document.createElement('strong');
            value.className = 'version-info-value';
            value.textContent = version;

            const description = document.createElement('p');
            description.className = 'version-info-description';
            description.textContent = 'This version is used for offline caching.';

            content.append(label, value, description);
            container.replaceChildren(content);
        }

        async function openPolicyModal(policyType) {
            const titleElement = document.getElementById('policyModalTitle');
            const body = document.getElementById('policyBody');
            const backdrop = document.getElementById('policyBackdrop');
            const modal = document.getElementById('policyModal');
            const policies = {
                privacy: { title: 'Privacy Policy', path: './assets/pp.json' },
                tos: { title: 'Terms of Service', path: './assets/tos.json' },
                version: { title: 'Version', path: './sw.js' }
            };
            const selectedPolicy = policies[policyType];

            if (!titleElement || !body || !backdrop || !modal) {
                console.error('error');
                return;
            }

            if (!selectedPolicy) {
                console.error(policyType);
                return;
            }

            const requestId = ++policyRequestId;
            clearPolicyCloseCleanup(modal);
            const loadingStartedAt = performance.now();
            titleElement.textContent = selectedPolicy.title;
            if (policyType === 'version') {
                showVersionLoading(body);
            } else {
                showPolicyLoading(body);
            }
            backdrop.classList.add('open');
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';

            let policy;
            let version;
            let loadError;

            try {
                const response = await fetch(selectedPolicy.path, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`error`);
                }

                if (policyType === 'version') {
                    const serviceWorkerSource = await response.text();
                    const cacheName = serviceWorkerSource.match(/\bconst\s+CACHE_NAME\s*=\s*(["'])(.*?)\1/);
                    if (!cacheName) {
                        throw new Error('CACHE_NAME was not found in sw.js');
                    }
                    version = cacheName[2];
                } else {
                    policy = await response.json();
                }
            } catch (error) {
                loadError = error;
            }

            const loadingDuration = performance.now() - loadingStartedAt;
            if (loadingDuration < 500) {
                await new Promise(resolve => setTimeout(resolve, 500 - loadingDuration));
            }

            if (requestId !== policyRequestId) return;
            if (loadError) {
                console.error(loadError);
                body.textContent = policyType === 'version'
                    ? 'e'
                    : 'error';
                return;
            }

            if (policyType === 'version') {
                if (!version) {
                    console.error('e');
                    body.textContent = 'error';
                    return;
                }
                renderVersionContent(body, version);
                return;
            }

            try {
                renderPolicyContent(body, policy);
            } catch (error) {
                console.error(error);
                body.textContent = 'error';
            }
        }

        function closePolicyModal() {
            const backdrop = document.getElementById('policyBackdrop');
            const modal = document.getElementById('policyModal');
            const body = document.getElementById('policyBody');
            const titleElement = document.getElementById('policyModalTitle');

            if (!backdrop || !modal) return;

            policyRequestId++;
            backdrop.classList.remove('open');
            modal.classList.remove('open');
            document.body.style.overflow = '';

            clearPolicyCloseCleanup(modal);
            const resetPolicyContent = event => {
                if (event && (event.target !== modal || event.propertyName !== 'transform')) return;
                if (modal.classList.contains('open')) return;

                clearPolicyCloseCleanup(modal);
                body?.replaceChildren();
                titleElement?.replaceChildren();
            };

            policyCloseHandler = resetPolicyContent;
            modal.addEventListener('transitionend', policyCloseHandler);
            policyCloseTimer = window.setTimeout(resetPolicyContent, 400);
        }
    </script>

    <script src="main.js"></script>
    <script src="number-of-senders.js"></script>
