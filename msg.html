<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        Arial,
        sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 22px 22px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .login-title {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .login-subtitle {
      text-align: center;
      color: #8e8e93;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .password-wrapper {
      position: relative;
    }

    #password {
      width: 100%;
      height: 48px;
      border: 1px solid #d1d1d6;
      border-radius: 12px;
      padding: 0 50px 0 14px;
      font-size: 16px;
      outline: none;
      background: #f9f9fb;
      color: #1c1c1e;
      transition: 0.2s;
    }

    #password:focus {
      border-color: #007aff;
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.12);
    }

    .show-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #007aff;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
    }

    #loginButton {
      width: 100%;
      height: 48px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    #loginButton:active {
      opacity: 0.7;
      transform: scale(0.98);
    }

    #loginButton:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .error {
      min-height: 18px;
      margin-top: 10px;
      text-align: center;
      color: #ff3b30;
      font-size: 13px;
    }

    .messages-screen {
      display: none;
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }

    .logout {
      border: none;
      background: #e5e5ea;
      color: #007aff;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    ul {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    li {
      background: #ffffff;
      padding: 16px;
      margin-bottom: 10px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .date {
      font-size: 12px;
      color: #8e8e93;
    }

    .name {
      font-weight: 600;
      margin-top: 6px;
      font-size: 16px;
    }

    .message {
      margin: 7px 0;
      font-size: 16px;
      line-height: 1.45;
      word-break: break-word;
    }

    .device {
      font-size: 12px;
      color: #8e8e93;
    }

    .loading {
      text-align: center;
      color: #8e8e93;
      padding: 25px;
    }
  </style>
</head>

<body>

  <div class="login-screen" id="loginScreen">

    <div class="login-box">

      <div class="login-title">
        Messages
      </div>

      <div class="login-subtitle">
        Enter your admin password
      </div>

      <div class="password-wrapper">

        <input type="password" id="password" placeholder="Password" autocomplete="current-password">

        <button class="show-password" id="showPassword" type="button">
          Show
        </button>

      </div>

      <button id="loginButton" type="button">
        Sign In
      </button>

      <div class="error" id="loginError"></div>

    </div>

  </div>

  <main class="messages-screen" id="messagesScreen">

    <div class="header">

      <h2>
        Messages
      </h2>

      <button class="logout" id="logoutButton">
        Sign Out
      </button>

    </div>

    <ul id="messages">

      <li class="loading">
        Loading messages...
      </li>

    </ul>

  </main>

  <script>
    const API =
      "https://wahyunaserver.wahyunadragon.workers.dev";

    const RECEIVE_API =
      API + "/receive-anonymous-messages";

    const loginScreen =
      document.getElementById("loginScreen");

    const messagesScreen =
      document.getElementById("messagesScreen");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const messages =
      document.getElementById("messages");

    const showPassword =
      document.getElementById("showPassword");

    const logoutButton =
      document.getElementById("logoutButton");

    showPassword.addEventListener(
      "click",
      () => {

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          showPassword.textContent = "Hide";
        } else {
          passwordInput.type = "password";
          showPassword.textContent = "Show";
        }

      }
    );

    loginButton.addEventListener(
      "click",
      login
    );

    passwordInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {
          login();
        }

      }
    );

    async function login() {

      const password =
        passwordInput.value;

      loginError.textContent = "";

      if (!password) {
        loginError.textContent =
          "Please enter your password.";
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Checking...";

      try {

        const response =
          await fetch(
            RECEIVE_API,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                password: password
              })
            }
          );

        const result =
          await response.json();

        if (
          !response.ok ||
          !result.success
        ) {
          throw new Error(
            result.error || "Invalid password"
          );
        }

        loginScreen.style.display = "none";
        messagesScreen.style.display = "block";

        displayMessages(result.data);

      } catch (error) {

        console.error(error);

        loginError.textContent =
          "Incorrect password or an error occurred.";

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Sign In";

      }
    }

    function displayMessages(data) {

      messages.innerHTML = "";

      if (!data || data.length === 0) {

        messages.innerHTML = `
          <li class="loading">
            No messages yet.
          </li>
        `;

        return;
      }

      data.forEach(item => {

        const li =
          document.createElement("li");

        const date =
          new Date(
            item.timestamp
          ).toLocaleString("en-US");

        li.innerHTML = `
          <div class="date">
            ${escapeHTML(date)}
          </div>

          <div class="name">
            ${escapeHTML(item.name)}
          </div>

          <div class="message">
            ${escapeHTML(item.message)}
          </div>

          <div class="device">
            Device: ${escapeHTML(item.device)}
          </div>
        `;

        messages.appendChild(li);

      });
    }

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent =
        String(text);

      return div.innerHTML;

    }

    logoutButton.addEventListener(
      "click",
      () => {

        passwordInput.value = "";
        loginError.textContent = "";

        messagesScreen.style.display = "none";
        loginScreen.style.display = "flex";

      }
    );
  </script>

</body>

</html>
